name: Bug report
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, TV model and Android version
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Remove tokens, proxy passwords and private media URLs.

name: Android CI
on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select affected checks
        id: scope
        run: python3 tools/scripts/ci_scope.py
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.scope.outputs.gradle == 'true'
        with:
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.pairing == 'true'
        with:
          node-version: '26.13.1'
          check-latest: false
      - name: Install structural check dependency
        if: steps.scope.outputs.structure == 'true'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Verify scaffold and wrapper integrity
        if: steps.scope.outputs.structure == 'true'
        run: python3 tools/scripts/verify_project.py
      - name: Pairing parser and encryption tests (Node 26.13.1)
        if: steps.scope.outputs.pairing == 'true'
        run: |
          node web/pairing/tests/node.mjs
          node web/pairing/tests/lan-node.mjs
      - name: Set up Android SDK
        if: steps.scope.outputs.android == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        if: steps.scope.outputs.android == 'true'
        run: android --no-metrics --sdk="$ANDROID_HOME" sdk install platforms/android-37.2 build-tools/36.0.0
      - name: Run affected Gradle checks
        if: steps.scope.outputs.gradle == 'true'
        env:
          AFFECTED_TASKS: ${{ steps.scope.outputs.tasks }}
        run: sh ./gradlew --no-daemon --build-cache $AFFECTED_TASKS
      - name: Sign 1.0.0 APK for existing installations
        if: steps.scope.outputs.android == 'true' && github.event_name != 'pull_request'
        env:
          XVIEW_KEYSTORE_BASE64: ${{ secrets.XVIEW_KEYSTORE_BASE64 }}
          XVIEW_KEYSTORE_PASSWORD: ${{ secrets.XVIEW_KEYSTORE_PASSWORD }}
          XVIEW_KEY_ALIAS: ${{ secrets.XVIEW_KEY_ALIAS }}
          XVIEW_KEY_PASSWORD: ${{ secrets.XVIEW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$XVIEW_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$XVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xview-signing.keystore"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/xview-signing.keystore" \
            --ks-pass env:XVIEW_KEYSTORE_PASSWORD --ks-key-alias "$XVIEW_KEY_ALIAS" \
            --key-pass env:XVIEW_KEY_PASSWORD \
            --out dist/xview-1.0.0.apk app/build/outputs/apk/optimized/app-optimized.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/xview-1.0.0.apk
          (cd dist && sha256sum xview-1.0.0.apk > SHA256SUMS)
          rm -f "$RUNNER_TEMP/xview-signing.keystore"
      - name: Upload installable APK
        if: steps.scope.outputs.android == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xview-1.0.0
          path: dist/
          if-no-files-found: error
      - name: Upload validation reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scope.outputs.gradle == 'true'
        with:
          name: validation-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn

name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          check-latest: false
      - name: Verify scaffold and wrapper integrity
        run: python3 tools/scripts/verify_project.py
      - name: Pairing parser and encryption tests (Node 26.13.1)
        run: |
          node web/pairing/tests/node.mjs
          node web/pairing/tests/lan-node.mjs
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, Android lint and application build
        run: sh ./gradlew --no-daemon :core:model:test :core:domain:test :core:provider:test :core:data:test :core:network:test :provider:demo:test :app:lintOptimized :app:assembleOptimized
      - name: Sign 1.0.0 APK for existing installations
        if: github.event_name != 'pull_request'
        env:
          XVIEW_KEYSTORE_BASE64: ${{ secrets.XVIEW_KEYSTORE_BASE64 }}
          XVIEW_KEYSTORE_PASSWORD: ${{ secrets.XVIEW_KEYSTORE_PASSWORD }}
          XVIEW_KEY_ALIAS: ${{ secrets.XVIEW_KEY_ALIAS }}
          XVIEW_KEY_PASSWORD: ${{ secrets.XVIEW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$XVIEW_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$XVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xview-signing.keystore"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/xview-signing.keystore" \
            --ks-pass env:XVIEW_KEYSTORE_PASSWORD --ks-key-alias "$XVIEW_KEY_ALIAS" \
            --key-pass env:XVIEW_KEY_PASSWORD \
            --out dist/xview-1.0.0.apk app/build/outputs/apk/optimized/app-optimized.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/xview-1.0.0.apk
          (cd dist && sha256sum xview-1.0.0.apk > SHA256SUMS)
          rm -f "$RUNNER_TEMP/xview-signing.keystore"
      - name: Upload installable APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xview-1.0.0
          path: dist/
          if-no-files-found: error
      - name: Upload validation reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-reports
          path: |
            **/build/reports/
          if-no-files-found: warn
